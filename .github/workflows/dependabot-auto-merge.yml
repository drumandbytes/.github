name: Dependabot auto-merge

# workflow_run, not pull_request: Dependabot's pull_request runs get a
# read-only token and no secrets, so they can't merge.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-merge:
    # The org default token is read-only, and a reusable workflow can't
    # raise the caller's permissions.
    permissions:
      contents: write
      pull-requests: write
    # Only Dependabot's runs are eligible; skip the rest before the call.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    uses: drumandbytes/reusable-actions/.github/workflows/auto-merge.yml@v1