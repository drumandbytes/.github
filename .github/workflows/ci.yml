name: CI

# dependabot-auto-merge.yml waits on this workflow.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Dependabot can't see this pin; bump by hand.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
      - run: ./actionlint -color

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff pyyaml
      - name: Lint
        run: |
          ruff check profile/scripts/
          ruff format --check profile/scripts/
      - name: Byte-compile
        run: python -m compileall -q profile/scripts/
      - name: Validate issue templates
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob(".github/ISSUE_TEMPLATE/*.yml"):
              yaml.safe_load(open(f))
              print("ok", f)
          PY

  # Stable name for the org ruleset's required check.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [actionlint, zizmor, scripts]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1