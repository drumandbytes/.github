name: Update profile

# Refreshes the blog block in profile/README.md from the drumandbytes.com
# RSS feed. Pushes as dnb-robot, the only bypass actor on the org's
# protecting-main ruleset (see dnb-tf's rulesets.tf).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate dnb-robot app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      # Keeps the token: the last step pushes with it.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Refresh profile README
        run: python3 profile/scripts/update_profile.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "dnb-robot[bot]"
          git config user.email "4773076+dnb-robot[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: refresh latest blog posts on profile"
          git push